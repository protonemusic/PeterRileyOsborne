name: Weight room tests

on:
  push:
    paths: ['weight-room/**', '.github/workflows/weight-room-tests.yml']
  pull_request:
    paths: ['weight-room/**', '.github/workflows/weight-room-tests.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: weight-room
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: weight-room/package-lock.json
      - run: npm ci
      - run: npm test
